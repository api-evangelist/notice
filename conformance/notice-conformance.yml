generated: '2026-08-26'
method: probed
source: live probes of the Notice auth + MCP plane (api.notice.co, api.stytch.notice.co)
summary: >-
  Notice conforms to the OAuth/OIDC/MCP discovery stack in full and to nothing else that can be
  verified anonymously. The REST v1 API is behind a 401, so no contract-level standard (JSON:API,
  RFC 9457, OData, pagination convention) can be asserted about it either way.
standards:
  - id: oauth2
    name: OAuth 2.0 authorization framework (RFC 6749)
    conforms: true
    evidence: >-
      authorization_code + refresh_token grants advertised by
      https://api.stytch.notice.co/.well-known/oauth-authorization-server (HTTP 200).
  - id: oauth2-pkce
    name: PKCE (RFC 7636)
    conforms: true
    evidence: 'code_challenge_methods_supported: ["S256"] in both discovery documents.'
  - id: rfc8414
    name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
    conforms: true
    evidence: https://api.stytch.notice.co/.well-known/oauth-authorization-server returns 200 with issuer, token_endpoint, jwks_uri.
  - id: rfc9728
    name: OAuth 2.0 Protected Resource Metadata (RFC 9728)
    conforms: true
    evidence: >-
      https://api.notice.co/.well-known/oauth-protected-resource returns 200 naming
      resource=https://api.notice.co/mcp and authorization_servers=[https://api.stytch.notice.co];
      the 401 from /mcp carries the matching WWW-Authenticate resource_metadata parameter.
  - id: rfc7591
    name: OAuth 2.0 Dynamic Client Registration (RFC 7591)
    conforms: true
    evidence: 'registration_endpoint: https://api.stytch.notice.co/v1/oauth2/register advertised in RFC 8414 metadata.'
  - id: oidc
    name: OpenID Connect Discovery 1.0
    conforms: true
    evidence: >-
      https://api.stytch.notice.co/.well-known/openid-configuration returns 200 with issuer,
      jwks_uri, userinfo_endpoint, id_token_signing_alg_values_supported [RS256].
  - id: mcp
    name: Model Context Protocol (Streamable HTTP transport, OAuth authorization)
    conforms: true
    evidence: >-
      https://api.notice.co/mcp answers JSON-RPC POSTs with an RFC 9728-linked 401 challenge, the
      MCP authorization flow as specified. Tool-level conformance is unverifiable while tools/list
      is gated.
  - id: rfc9116
    name: security.txt (RFC 9116)
    conforms: false
    evidence: 404 on /.well-known/security.txt for notice.co and api.notice.co.
  - id: a2a
    name: A2A Agent Card
    conforms: false
    evidence: 404 on /.well-known/agent-card.json and /.well-known/agent.json for every host.
  - id: rfc9457
    name: Problem Details for HTTP APIs (RFC 9457)
    conforms: false
    evidence: >-
      Observed error bodies are a bare {"error":"..."} object with content-type application/json,
      not application/problem+json (401s from /mcp and /v1/openapi.json).
  - id: openapi
    name: OpenAPI description published
    conforms: false
    evidence: >-
      https://api.notice.co/v1/openapi.json exists as a route but returns 401 {"error":"Not
      authorized"} - the description is subscriber-only, not public.
domain_standard:
  assessed: true
  standard: null
  note: >-
    Private secondary-market data has no adopted machine-readable domain standard comparable to
    FIX/ISO 20022 in public markets - Notice's own product (Notice Price, Activity Score, Coverage
    Ratio, the N50 index) is proprietary methodology published as prose in the help centre. Nothing
    in the reachable surface declares FIX, ISO 20022, FDX, or an SEC/FINRA machine schema, and none
    is invented here. Reward-only check: recorded as not applicable rather than failed.
compliance_certifications: []
