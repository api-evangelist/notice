aid: notice
name: Notice
description: >-
  Notice (notice.co) is a private-market data and investing platform founded in 2021 by Philip West
  and Tyson Hendricksen and headquartered in Wilmington, Delaware. It publishes Notice Price, a
  real-time evaluated price for private company stock recomputed every three seconds from private
  market transactions, indications of interest and public comparables, alongside company profiles,
  rankings, industry screeners and the Notice.co 50 Index (N50) covering 6,000+ private companies.
  Its commercial surface is a RESTful enterprise API that imports that same real-time data - Notice
  Price, verified trades and indications of interest - into a subscriber's own systems, plus a live
  OAuth-protected MCP server at api.notice.co/mcp and a free embeddable chart widget. Notice shares
  trade on secondary marketplaces including Forge and Nasdaq Private Market.
