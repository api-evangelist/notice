apis:
- name: Notice API
  description: >-
    RESTful enterprise API for real-time private market data across 6,000+ companies - Notice Price,
    verified trades and indications of interest - retrievable up to once per minute. Sold as a
    12-month enterprise subscription priced by the data subscribed to; the OpenAPI description at
    /v1/openapi.json exists as a route but returns 401 to anonymous callers, so no public contract
    is available.
  humanURL: https://learn.notice.co/en/articles/8422141-how-does-the-notice-api-work
